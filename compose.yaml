services:
  game:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?Set GAME_DOMAIN to your real domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - game
volumes:
  caddy_data:
  caddy_config:
